####################################################################
# hd2-macro config            ~/.config/hd2-macro/config.toml
# Edit, then:  systemctl --user restart hd2-macro
####################################################################

# ------------------------------------------------------------------
# Desktop notifications on arm/disarm, start/stop and panic.
# Uses `omarchy notification send` when available (falls back to
# notify-send), and reuses one notification id so the toast updates
# in place instead of stacking.
# ------------------------------------------------------------------
[notify]
enabled    = true
timeout_ms = 1800

# Nerd Font glyphs shown on the toast. Defaults are the Material
# Design xbox-controller pair; pick others at nerdfonts.com/cheat-sheet.
[notify.glyphs]
armed    = "\U000F05BA"   # nf-md-microsoft_xbox_controller
disarmed = "\U000F05BB"   # nf-md-microsoft_xbox_controller_off
panic    = "\U000F073A"   # nf-md-cancel

# ------------------------------------------------------------------
# Virtual pad identity. Leave alone unless you know what you're doing:
# Chromium picks the "standard" gamepad mapping from vendor/product,
# and xbox.com/play refuses anything it can't map.
# ------------------------------------------------------------------
[pad]
name    = "Microsoft X-Box 360 pad"
vendor  = 0x045e
product = 0x028e
version = 0x0114
wake_button = "LS"     # pressed by `hd2-macro wake` to make the browser notice the pad

# ------------------------------------------------------------------
# Timing. xCloud samples the pad ~60Hz and ships input over the
# network, so presses shorter than ~60ms get dropped. If stratagems
# misfire, raise press_ms/gap_ms first.
#
# Test a change without editing this file:
#     hd2-macro run reinforce --speed 0.5
# ------------------------------------------------------------------
[timing]
press_ms = 80          # how long each button is held
gap_ms   = 60          # pause between presses
speed    = 1.0         # global multiplier: 0.5 = half speed, 2.0 = twice as fast

# ------------------------------------------------------------------
# Helldivers 2 stratagem routine
#
#   hold LB -> wait pre_ms -> tap the code -> wait post_ms -> release LB
#
# IMPORTANT: the D-pad is only the stratagem keypad *while the menu is
# open*. Outside it, HD2 binds D-pad Up=Quick Stim, Right=Grenade,
# Down=Backpack Function, Left=Emote. So a direction that lands before
# the menu opens comes out as a weapon action -- that is what pre_ms
# guards. post_ms guards the opposite end; see below.
#
# Tune either one live, without editing this file or restarting:
#     hd2-macro run reinforce --post 40
#     hd2-macro run reinforce --pre 400 --speed 0.5
#
# After a valid code the diver draws the beacon and holds it. That is
# usually where you want the macro to stop, so you can aim and throw it
# yourself. throw_button is therefore OFF by default -- setting it to
# "RT" (Fire) throws the beacon immediately, wherever you happen to be
# pointing, and puts you straight back on your rifle.
# ------------------------------------------------------------------
[stratagem]
hold_button = "LB"     # the stratagem button on an Xbox pad
hold_mode   = "hold"   # "hold" = hold while entering  |  "tap" = press once to open
pre_ms      = 250      # after opening the menu, before the first direction
post_ms     = 80       # after the last direction releases, before LB releases.
                       # Keep this SMALL. HD2 closes the stratagem menu the
                       # moment a valid code lands; LB still held after that
                       # re-opens it, and releasing it then with an empty code
                       # buffer stows the beacon you just drew -- the diver
                       # "selects the orb, then switches back to rifle".

throw_button   = ""    # "" = keep the beacon in hand.  "RT" = auto-throw
throw_delay_ms = 300
throw_ms       = 120

# ------------------------------------------------------------------
# Passthrough: keep the browser down to ONE gamepad.
#
# If you also play with a real controller, the browser would otherwise
# see two pads (yours + this virtual one) and xCloud gets confused.
# With passthrough on, hd2-macro takes an exclusive kernel grab of the
# real pad and re-emits everything through the virtual one. A grab is
# device-wide, so the real pad's own jsN node goes completely silent.
#
# The silent node still *exists*, so also run `hd2-macro hide` once to
# strip its permissions and keep it out of the browser's list entirely.
# Check the result any time with `hd2-macro devices`.
# ------------------------------------------------------------------
[passthrough]
enabled = true
match   = []           # [] = first gamepad found; or ["Xbox"] / ["045e:0b12"]

# ------------------------------------------------------------------
# Keyboards to watch. Only used when [hotkeys] has keyboard entries.
# ------------------------------------------------------------------
[keyboards]
match = []             # [] = every keyboard; or e.g. ["G915", "AT Translated"]

# ------------------------------------------------------------------
# Hotkeys:  <key> = "<target>"
#
# Targets:
#   "reinforce"        a [stratagems] entry
#   "strat:UDRLU"      a literal code, no entry needed
#   "macro:dive_prone" a [macros.*] block
#   "press:A 300"      one button for 300ms
#   "toggle"           arm/disarm without stopping the daemon
#   "panic"            release everything
#   "wake"             nudge the pad so the browser exposes it
#
# Keys:
#   "1", "F13"      an evdev KEY_* name, minus the prefix
#   "ALT+SHIFT+M"   a chord; modifiers are CTRL, ALT, SHIFT, SUPER
#   "pad:RECORD"    a button on the passed-through controller
#
# Matching is exact: `1` fires only on a bare 1, never on SHIFT+1.
# Keyboard keys need read access to keyboards -- run `hd2-macro grant`.
# `pad:` buttons need no extra permissions and are consumed, never
# forwarded to the game.
#
# Find the name of any key or chord with:  hd2-macro keys
# ------------------------------------------------------------------
[hotkeys]
# The digit row: one stratagem each. Swap the names for your loadout --
# anything from [stratagems] below, or "strat:URDDD" for a raw code.
1 = "eagle_napalm_airstrike"
2 = "gatling_sentry"
3 = "machine_gun_sentry"
4 = "autocannon_sentry"
5 = "resupply"
6 = "reinforce"
7 = "sos_beacon"
8 = "hellbomb"

# Safety. ALT+SHIFT+M toggles every other hotkey on and off without
# stopping the daemon, so the keyboard goes back to normal typing.
# Verified free: Hyprland only binds M with SUPER held, and Chromium's
# Alt+Shift+<letter> accelerators (I B A R T C P X Z W) skip M.
"ALT+SHIFT+M" = "toggle"
"ALT+SHIFT+P" = "panic"        # release every button right now
"pad:RECORD"  = "panic"        # Xbox share button, same thing

# Find the name of any other key or chord with:  hd2-macro keys
# Modifiers: CTRL, ALT, SHIFT, SUPER -- combine with +.
# F13-F24 never collide with anything, since no physical key sends them.
# MINUS = "eagle_rearm"
# EQUAL = "macro:turtle_up"
# F13   = "orbital_railcannon_strike"

# ------------------------------------------------------------------
# Optional: only let hotkeys fire while a matching window is focused,
# so the digit row stays harmless everywhere else. Matched
# case-insensitively against the focused window's class and title
# (Hyprland only). [] = off, fire whenever the daemon is running.
#
# Worth turning on once you have all ten digits mapped:
# ------------------------------------------------------------------
[focus]
only_when = []
# only_when = ["xbox.com"]

# ------------------------------------------------------------------
# Stratagem codes. U/D/L/R (or up/down/left/right, or arrows).
# VERIFY these against your loadout - Arrowhead changes codes between
# patches and you only need the ones you actually bring.
# ------------------------------------------------------------------
[stratagems]
# mission
reinforce                = "UDRLU"
resupply                 = "DDUR"
sos_beacon               = "UDRU"
hellbomb                 = "DULDURDU"
seaf_artillery           = "RUUD"
upload_data              = "DRULUU"

# eagle
eagle_strafing_run       = "URR"
eagle_airstrike          = "URDR"
eagle_cluster_bomb       = "URDDR"
eagle_napalm_airstrike   = "URDU"
eagle_smoke_strike       = "URUD"
eagle_110mm_rocket_pods  = "URUL"
eagle_500kg              = "URDDD"
eagle_rearm              = "UULUR"

# orbital
orbital_gatling_barrage      = "RDLUU"
orbital_airburst_strike      = "RRR"
orbital_120mm_he_barrage     = "RRDLRD"
orbital_380mm_he_barrage     = "RDUULDD"
orbital_walking_barrage      = "RDRDRD"
orbital_laser                = "RDURD"
orbital_railcannon_strike    = "RUDDR"
orbital_precision_strike     = "RRU"
orbital_gas_strike           = "RRDR"
orbital_ems_strike           = "RRLD"
orbital_smoke_strike         = "RRDU"

# support weapons
machine_gun              = "DLDUR"
anti_materiel_rifle      = "DLRUD"
stalwart                 = "DLDUUL"
expendable_anti_tank     = "DDLUR"
recoilless_rifle         = "DLRRL"
flamethrower             = "DLUDU"
autocannon               = "DLDUUR"
heavy_machine_gun        = "DLUDD"
railgun                  = "DRDULR"
spear                    = "DDUDD"
grenade_launcher         = "DLULD"
laser_cannon             = "DLDUL"
arc_thrower              = "DRDULL"
quasar_cannon            = "DDULR"

# backpacks
jump_pack                = "DUUDU"
supply_pack              = "DLDUUD"
guard_dog_rover          = "DULURR"
guard_dog                = "DULURD"
shield_generator_pack    = "DULRLR"
ballistic_shield         = "DLDDUL"

# emplacements / sentries
anti_personnel_minefield = "DLUR"
incendiary_mines         = "DLLD"
tesla_tower              = "DURULR"
hmg_emplacement          = "DULRRL"
shield_generator_relay   = "DDLRLR"
machine_gun_sentry       = "DURRU"
gatling_sentry           = "DURL"
mortar_sentry            = "DURRD"
autocannon_sentry        = "DURULU"
rocket_sentry            = "DURRL"
ems_mortar_sentry        = "DURDR"

# ------------------------------------------------------------------
# Free-form macros. Steps run top to bottom.
#
#   press <CTL> [ms]      tap a control (default timing.press_ms)
#   down  <CTL>           hold it
#   up    <CTL>           release it
#   wait  <ms>
#   code  <UDLR...>       d-pad sequence using timing.press_ms/gap_ms
#   strat <UDLR|name>     full stratagem routine (hold + code + release)
#   axis  <LT|RT> <0-255> [ms]
#   stick <L|R> <x> <y> [ms]       x/y are -1.0 .. 1.0
#   repeat <n> <step...>
#   neutral               release everything
#
# Controls: A B X Y LB RB LT RT BACK START GUIDE LS RS UP DOWN LEFT RIGHT
# ------------------------------------------------------------------
[macros.dive_prone]
steps = ["press B 120", "wait 150", "press B 120"]

[macros.reload_and_stim]
steps = ["press X 120", "wait 900", "press UP 100"]

# Call in a defensive nest: MG sentry, then mines, then a shield relay.
[macros.turtle_up]
steps = [
  "strat DURRU",     # machine gun sentry
  "wait 600",
  "strat DLUR",      # anti-personnel minefield
  "wait 600",
  "strat DDLRLR",    # shield generator relay
]

# Emote wheel spin, mostly to prove sticks work.
[macros.spin]
steps = ["stick L 1 0 200", "stick L 0 1 200", "stick L -1 0 200", "stick L 0 -1 200", "neutral"]
